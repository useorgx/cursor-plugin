name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install trusted publishing npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check plugin
        run: npm run check

      - name: Pack release artifact
        run: npm run pack

      - name: Resolve release metadata
        id: release
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF?.startsWith('refs/tags/') && process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package v${pkg.version}`);
          }
          console.log(`name=${pkg.name}`);
          console.log(`version=${pkg.version}`);
          console.log(`tag=${pkg.version.includes('-') ? 'alpha' : 'latest'}`);
          NODE

      - name: Check registry
        id: registry
        run: |
          if npm view "${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish ./artifacts/*.tgz --access public --tag "${{ steps.release.outputs.tag }}"

      - name: Verify registry version
        run: |
          for _ in {1..12}; do
            actual="$(npm view "${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }}" version 2>/dev/null || true)"
            test "$actual" = "${{ steps.release.outputs.version }}" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: artifacts/*.tgz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true
